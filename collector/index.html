<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RemoteGuard 수집기</title>
<style>
  :root{
    --ink:#0E1418; --ground:#E7EAEC; --panel:#FFFFFF; --rule:#C2CACF;
    --dim:#5C686F; --live:#0E7C7B; --alert:#B3261E; --warn:#A15C00;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%}
  body{
    background:var(--ground); color:var(--ink); font-family:var(--sans);
    font-size:15px; line-height:1.45; overscroll-behavior:none;
    touch-action:manipulation; -webkit-user-select:none; user-select:none;
    display:flex; flex-direction:column;
  }
  header{
    padding:10px 14px; border-bottom:1px solid var(--rule); background:var(--panel);
    display:flex; align-items:baseline; gap:10px; flex:0 0 auto;
  }
  header h1{font:600 13px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; margin:0}
  header .ver{font:400 11px/1 var(--mono); color:var(--dim)}
  main{flex:1 1 auto; overflow-y:auto; padding:14px; padding-bottom:4px}
  .card{background:var(--panel); border:1px solid var(--rule); padding:14px; margin-bottom:12px}
  .card h2{font:600 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
    color:var(--dim); margin:0 0 10px}
  label{display:block; font:500 11px/1.6 var(--mono); letter-spacing:.08em;
    text-transform:uppercase; color:var(--dim); margin-bottom:4px}
  input[type=text],input[type=number],select{
    width:100%; font:400 16px/1.3 var(--mono); padding:9px 10px;
    border:1px solid var(--rule); background:var(--panel); color:var(--ink);
    border-radius:0; -webkit-appearance:none; appearance:none;
  }
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--live); outline-offset:1px}
  .row{display:flex; gap:10px; margin-bottom:12px}
  .row>*{flex:1}
  button{
    font:600 14px/1 var(--sans); padding:14px 16px; border:1px solid var(--ink);
    background:var(--ink); color:var(--panel); width:100%; border-radius:0; cursor:pointer;
  }
  button.ghost{background:var(--panel); color:var(--ink)}
  button:disabled{opacity:.35}
  .seg{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .seg button{
    font:500 12px/1.25 var(--mono); padding:12px 8px; background:var(--panel);
    color:var(--ink); border:1px solid var(--rule); text-align:left;
  }
  .seg button[aria-pressed=true]{background:var(--ink); color:var(--panel); border-color:var(--ink)}
  .seg small{display:block; font-weight:400; opacity:.65; margin-top:3px; font-size:10px}

  /* live instrument strip */
  #scope{width:100%; height:96px; display:block; background:var(--panel); border:1px solid var(--rule)}
  .telem{display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--rule); border-top:0}
  .telem div{padding:7px 8px; border-right:1px solid var(--rule); background:var(--panel)}
  .telem div:last-child{border-right:0}
  .telem dt{font:500 9px/1.4 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin:0}
  .telem dd{font:600 16px/1.2 var(--mono); margin:2px 0 0}
  .telem dd.bad{color:var(--alert)} .telem dd.good{color:var(--live)} .telem dd.warn{color:var(--warn)}

  /* mock transfer task */
  .task{background:var(--panel); border:1px solid var(--rule); padding:16px}
  .task .step{font:500 10px/1 var(--mono); letter-spacing:.12em; color:var(--dim); text-transform:uppercase}
  .task h3{font:600 19px/1.3 var(--sans); margin:8px 0 14px}
  .acct{border:1px solid var(--rule); padding:12px; margin-bottom:8px; cursor:pointer; background:var(--panel)}
  .acct[aria-pressed=true]{border-color:var(--ink); border-width:2px; padding:11px}
  .acct b{display:block; font:600 15px/1.3 var(--sans)}
  .acct span{font:400 12px/1.4 var(--mono); color:var(--dim)}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
  .keypad button{font:500 22px/1 var(--mono); padding:16px 0; background:var(--panel); color:var(--ink); border:1px solid var(--rule)}
  .amount{font:600 30px/1.2 var(--mono); text-align:right; padding:12px; border:1px solid var(--rule); min-height:60px}
  .amount small{font:400 15px; color:var(--dim)}
  .hint{font:400 12px/1.5 var(--sans); color:var(--dim); margin:10px 0 0}
  .warnbox{border-left:3px solid var(--warn); padding:8px 10px; background:#FFF8EC; font:400 12px/1.5 var(--sans); margin-bottom:12px}
  .okbox{border-left:3px solid var(--live); padding:8px 10px; background:#EDF7F6; font:400 12px/1.5 var(--sans); margin-bottom:12px}
  .errbox{border-left:3px solid var(--alert); padding:8px 10px; background:#FCEEEC; font:400 12px/1.5 var(--sans); margin-bottom:12px}
  pre{font:400 11px/1.5 var(--mono); background:#F4F6F7; border:1px solid var(--rule); padding:10px; overflow-x:auto; max-height:200px; white-space:pre-wrap; word-break:break-all}
  .hide{display:none !important}
  footer{flex:0 0 auto; padding:8px 14px 14px}
</style>
</head>
<body>
<header>
  <h1>RemoteGuard</h1><span class="ver">수집기 v1 · Phase 0–1</span>
</header>

<main>
  <!-- ── SETUP ───────────────────────────────────────────── -->
  <section id="setup">
    <div class="card">
      <h2>세션 정보</h2>
      <div class="row">
        <div><label for="subject">참여자 ID</label><input id="subject" type="text" value="s01" autocomplete="off"></div>
        <div><label for="trial">회차</label><input id="trial" type="number" value="1" min="1"></div>
      </div>
      <label>수집 조건</label>
      <div class="seg" id="cond">
        <button data-c="handheld" aria-pressed="true">handheld<small>손에 들고 직접 조작</small></button>
        <button data-c="desk" aria-pressed="false">desk<small>책상·거치대에 놓고 직접 조작</small></button>
        <button data-c="remote_scrcpy" aria-pressed="false">remote_scrcpy<small>PC에서 scrcpy로 원격 조작</small></button>
        <button data-c="remote_a11y" aria-pressed="false">remote_a11y<small>접근성/원격제어 앱 조작</small></button>
      </div>
      <p class="hint">라벨은 나중에 못 고칩니다. 시작 전에 조건을 반드시 확인하세요.
        <code>desk</code>는 정상(0) 라벨이고 오탐 검증용 핵심 조건입니다.</p>
    </div>

    <div class="card">
      <h2>센서 점검</h2>
      <div id="sensorStatus" class="warnbox">DeviceMotion 권한을 아직 요청하지 않았습니다.</div>
      <button id="btnPermit" class="ghost">모션 센서 권한 요청</button>
      <p class="hint">HTTPS에서만 동작합니다. <code>http://</code>로 열었다면 센서가 잡히지 않습니다.</p>
    </div>

    <footer><button id="btnStart" disabled>수집 시작</button></footer>
  </section>

  <!-- ── TASK ────────────────────────────────────────────── -->
  <section id="task" class="hide">
    <canvas id="scope"></canvas>
    <dl class="telem">
      <div><dt>모션 Hz</dt><dd id="tHz">–</dd></div>
      <div><dt>클럭 편차</dt><dd id="tSkew">–</dd></div>
      <div><dt>입력</dt><dd id="tIn">0</dd></div>
      <div><dt>결합 z</dt><dd id="tZ">–</dd></div>
    </dl>

    <div style="height:12px"></div>
    <div class="task" id="taskBody"></div>
    <footer><button id="btnStop" class="ghost">세션 종료</button></footer>
  </section>

  <!-- ── DONE ────────────────────────────────────────────── -->
  <section id="done" class="hide">
    <div class="card">
      <h2>세션 요약</h2>
      <div id="doneMsg"></div>
      <pre id="summary"></pre>
    </div>
    <div class="card">
      <h2>저장</h2>
      <button id="btnDownload" class="ghost" style="margin-bottom:8px">JSON 내려받기</button>
      <label for="api">업로드 서버 (선택)</label>
      <input id="api" type="text" placeholder="https://your-api.example.com" autocomplete="off">
      <div style="height:8px"></div>
      <button id="btnUpload" class="ghost">서버로 업로드</button>
      <div id="upMsg" style="margin-top:10px"></div>
    </div>
    <footer><button id="btnAgain">다음 세션</button></footer>
  </section>
</main>

<script src="../shared/features.js"></script>
<script>
'use strict';
/* ------------------------------------------------------------------
   RemoteGuard collector
   Captures every input and motion event on ONE clock (performance.now)
   and records the offset against each event's own timeStamp, so the
   touch/IMU alignment assumption is measured rather than assumed.
------------------------------------------------------------------- */

var S = {
  events: [], recording: false, cond: 'handheld',
  t0: 0, skews: [], motionCount: 0, inputCount: 0, lastMotionT: 0,
  scope: [], touchMarks: [], hasMotion: false
};

var $ = function (id) { return document.getElementById(id); };

// ── condition selector ───────────────────────────────────────────
$('cond').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  [].forEach.call(this.querySelectorAll('button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  S.cond = b.dataset.c;
});

// ── motion permission (iOS needs a user gesture; Android does not) ─
$('btnPermit').addEventListener('click', function () {
  var need = typeof DeviceMotionEvent !== 'undefined' &&
             typeof DeviceMotionEvent.requestPermission === 'function';
  if (need) {
    DeviceMotionEvent.requestPermission().then(function (r) {
      if (r === 'granted') armMotion(); else setSensor('denied', '권한이 거부되었습니다. iOS는 Safari 설정에서 모션 접근을 허용해야 합니다.');
    }).catch(function (err) { setSensor('denied', '권한 요청 실패: ' + err.message); });
  } else { armMotion(); }
});

function setSensor(kind, msg) {
  var el = $('sensorStatus');
  el.className = kind === 'ok' ? 'okbox' : (kind === 'denied' ? 'errbox' : 'warnbox');
  el.textContent = msg;
}

var probeHandler = null;
function armMotion() {
  setSensor('warn', '센서 확인 중… 기기를 손에 들고 2초만 기다리세요.');
  var n = 0, first = 0;
  probeHandler = function (e) {
    if (!n) first = performance.now();
    n++;
    if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x !== null) S.hasMotion = true;
    if (n >= 20) {
      window.removeEventListener('devicemotion', probeHandler);
      var hz = (n - 1) / ((performance.now() - first) / 1000);
      if (!S.hasMotion) {
        setSensor('denied', '이벤트는 오지만 가속도 값이 비어 있습니다. 이 기기/브라우저에서는 IMU 층을 쓸 수 없습니다.');
      } else {
        setSensor('ok', '센서 정상 · 실측 ' + hz.toFixed(1) + ' Hz' +
          (hz < 25 ? ' — 샘플레이트가 낮습니다. 임펄스 검출 대신 대역 에너지 특징에 의존하세요.' : ''));
        $('btnStart').disabled = false;
      }
    }
  };
  window.addEventListener('devicemotion', probeHandler);
  setTimeout(function () {
    if (!$('btnStart').disabled) return;
    window.removeEventListener('devicemotion', probeHandler);
    setSensor('denied', 'devicemotion 이벤트가 전혀 오지 않습니다. HTTPS인지, 안드로이드 크롬인지 확인하세요.');
  }, 4000);
}

// ── capture ──────────────────────────────────────────────────────
function push(ev) { if (S.recording) S.events.push(ev); }

function recordInput(e, type) {
  if (!S.recording) return;
  var now = performance.now();
  if (typeof e.timeStamp === 'number' && e.timeStamp > 0) S.skews.push(now - e.timeStamp);
  var t = (typeof e.timeStamp === 'number' && e.timeStamp > 0) ? e.timeStamp : now;

  var pts = e.changedTouches ? e.changedTouches : [e];
  for (var i = 0; i < pts.length; i++) {
    var p = pts[i];
    push({
      t: t, type: type,
      x: +(p.clientX).toFixed(3), y: +(p.clientY).toFixed(3),
      force: (p.force != null ? p.force : (p.pressure != null ? p.pressure : null)),
      rx: (p.radiusX != null ? p.radiusX : (p.width != null ? p.width : null)),
      ry: (p.radiusY != null ? p.radiusY : (p.height != null ? p.height : null)),
      ptype: e.changedTouches ? 'touch' : (p.pointerType || 'mouse'),
      id: (p.identifier != null ? p.identifier : (p.pointerId != null ? p.pointerId : 0))
    });
    if (/start|down/.test(type)) S.touchMarks.push(t);
  }
  S.inputCount++;
  $('tIn').textContent = S.inputCount;
}

['touchstart', 'touchmove', 'touchend'].forEach(function (k) {
  window.addEventListener(k, function (e) { recordInput(e, k); }, { passive: true, capture: true });
});
// mouse events on a phone are themselves a signal: some remote stacks emit them
['mousedown', 'mousemove', 'mouseup'].forEach(function (k) {
  window.addEventListener(k, function (e) {
    if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return; // synthesised from touch
    recordInput(e, k);
  }, { passive: true, capture: true });
});

window.addEventListener('devicemotion', function (e) {
  if (!S.recording) return;
  var now = performance.now();
  var a = e.accelerationIncludingGravity || {}, r = e.rotationRate || {};
  push({
    t: now, type: 'motion',
    ax: a.x, ay: a.y, az: a.z,
    gx: r.alpha, gy: r.beta, gz: r.gamma,
    interval: e.interval
  });
  S.motionCount++;
  var mag = Math.hypot(a.x || 0, a.y || 0, a.z || 9.80665) - 9.80665;
  S.scope.push({ t: now, v: mag });
  if (S.scope.length > 600) S.scope.shift();
});

// ── live instrument ──────────────────────────────────────────────
var cv = $('scope'), cx = cv.getContext('2d');
function sizeScope() {
  var dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', sizeScope);

function drawScope() {
  if (!S.recording) return;
  var W = cv.clientWidth, H = cv.clientHeight;
  cx.clearRect(0, 0, W, H);
  var now = performance.now(), SPAN = 6000;

  cx.strokeStyle = '#E2E7E9'; cx.lineWidth = 1;
  [0.25, 0.5, 0.75].forEach(function (f) {
    cx.beginPath(); cx.moveTo(0, H * f); cx.lineTo(W, H * f); cx.stroke();
  });

  // touch-down markers: the visual claim of the whole project is that the
  // trace should twitch at these lines
  cx.strokeStyle = '#B3261E'; cx.lineWidth = 1;
  S.touchMarks = S.touchMarks.filter(function (t) { return now - t < SPAN; });
  S.touchMarks.forEach(function (t) {
    var x = W * (1 - (now - t) / SPAN);
    cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke();
  });

  var pts = S.scope.filter(function (p) { return now - p.t < SPAN; });
  if (pts.length > 1) {
    var amp = 0;
    pts.forEach(function (p) { amp = Math.max(amp, Math.abs(p.v)); });
    amp = Math.max(amp, 0.15);
    cx.strokeStyle = '#0E7C7B'; cx.lineWidth = 1.4; cx.beginPath();
    pts.forEach(function (p, i) {
      var x = W * (1 - (now - p.t) / SPAN);
      var y = H / 2 - (p.v / amp) * (H / 2 - 6);
      i ? cx.lineTo(x, y) : cx.moveTo(x, y);
    });
    cx.stroke();
    cx.fillStyle = '#5C686F'; cx.font = '10px ui-monospace, monospace';
    cx.fillText('±' + amp.toFixed(2) + ' m/s²', 6, 12);
  }
  requestAnimationFrame(drawScope);
}

// live telemetry, recomputed on the most recent 3 s window
setInterval(function () {
  if (!S.recording) return;
  var now = performance.now();
  var recent = S.events.filter(function (e) { return now - e.t < 3000; });
  var mot = recent.filter(function (e) { return e.type === 'motion'; });
  if (mot.length > 4) {
    var hz = (mot.length - 1) / ((mot[mot.length - 1].t - mot[0].t) / 1000);
    var el = $('tHz'); el.textContent = hz.toFixed(0);
    el.className = hz >= 40 ? 'good' : (hz >= 20 ? 'warn' : 'bad');
  }
  if (S.skews.length) {
    var m = S.skews.slice(-50).reduce(function (a, b) { return a + b; }, 0) / Math.min(50, S.skews.length);
    var el2 = $('tSkew'); el2.textContent = m.toFixed(1) + 'ms';
    el2.className = Math.abs(m) < 20 ? 'good' : 'bad';
  }
  if (recent.length > 10 && window.RGFeatures) {
    try {
      var f = RGFeatures.featuresFor(recent);
      var z = $('tZ');
      z.textContent = f.m_coupling_z.toFixed(2);
      z.className = f.m_coupling_z > 1.5 ? 'good' : (f.m_coupling_z > 0.5 ? 'warn' : 'bad');
    } catch (err) { /* live readout is best-effort */ }
  }
}, 700);

// ── mock transfer task ───────────────────────────────────────────
/* Deliberately a mock. We never clone a real bank UI and never ask for a real
   credential — the flow only has to produce the same *kind* of interaction
   (target acquisition, digit entry, confirmation) as a real transfer. */
var TASK = [
  { step: '1 / 4', title: '보낼 계좌를 고르세요', kind: 'accounts' },
  { step: '2 / 4', title: '금액을 입력하세요', kind: 'amount' },
  { step: '3 / 4', title: '내용을 확인하세요', kind: 'confirm' },
  { step: '4 / 4', title: '이체가 완료되었습니다', kind: 'end' }
];
var taskIdx = 0, chosen = null, amount = '';

function renderTask() {
  var t = TASK[taskIdx], b = $('taskBody'), h = '';
  h += '<div class="step">' + t.step + '</div><h3>' + t.title + '</h3>';
  if (t.kind === 'accounts') {
    [['김민수', '국민 123-45-678901'], ['이서연', '신한 110-222-333444'], ['박지훈', '농협 302-1234-5678-01']]
      .forEach(function (a, i) {
        h += '<div class="acct" data-i="' + i + '" aria-pressed="' + (chosen === i) + '"><b>' + a[0] + '</b><span>' + a[1] + '</span></div>';
      });
    h += '<div style="height:10px"></div><button id="next" ' + (chosen === null ? 'disabled' : '') + '>다음</button>';
  } else if (t.kind === 'amount') {
    h += '<div class="amount">' + (amount ? Number(amount).toLocaleString() : '0') + ' <small>원</small></div><div class="keypad">';
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '←'].forEach(function (k) {
      h += '<button data-k="' + k + '">' + k + '</button>';
    });
    h += '</div><div style="height:10px"></div><button id="next" ' + (amount ? '' : 'disabled') + '>다음</button>';
  } else if (t.kind === 'confirm') {
    h += '<div class="acct" aria-pressed="true"><b>' + ['김민수', '이서연', '박지훈'][chosen] + '</b><span>' + Number(amount).toLocaleString() + ' 원</span></div>';
    h += '<p class="hint">실제 이체는 일어나지 않습니다. 모의 화면입니다.</p>';
    h += '<div style="height:10px"></div><button id="next">이체하기</button>';
  } else {
    h += '<div class="okbox">모의 이체 완료. 아래에서 세션을 종료하세요.</div>';
  }
  b.innerHTML = h;

  var nx = document.getElementById('next');
  if (nx) nx.onclick = function () { taskIdx++; renderTask(); };
  b.querySelectorAll('.acct[data-i]').forEach(function (el) {
    el.onclick = function () { chosen = +el.dataset.i; renderTask(); };
  });
  b.querySelectorAll('[data-k]').forEach(function (el) {
    el.onclick = function () {
      var k = el.dataset.k;
      if (k === '←') amount = amount.slice(0, -1);
      else if (amount.length < 9) amount += k;
      renderTask();
    };
  });
}

// ── session lifecycle ────────────────────────────────────────────
$('btnStart').addEventListener('click', function () {
  S.events = []; S.skews = []; S.scope = []; S.touchMarks = [];
  S.inputCount = 0; S.motionCount = 0;
  taskIdx = 0; chosen = null; amount = '';
  S.recording = true; S.t0 = performance.now();
  $('setup').classList.add('hide'); $('task').classList.remove('hide');
  sizeScope(); renderTask(); requestAnimationFrame(drawScope);
});

$('btnStop').addEventListener('click', function () { stop(); });

function stop() {
  S.recording = false;
  $('task').classList.add('hide'); $('done').classList.remove('hide');
  var sess = buildSession();
  window.__lastSession = sess;

  var wins = [];
  try { wins = RGFeatures.extractWindows(sess.events); } catch (e) {}
  var zs = wins.map(function (w) { return w.m_coupling_z; });
  var meanZ = zs.length ? zs.reduce(function (a, b) { return a + b; }, 0) / zs.length : 0;

  $('doneMsg').className = wins.length >= 3 ? 'okbox' : 'warnbox';
  $('doneMsg').textContent = wins.length >= 3
    ? '세션 유효. 특징 윈도우 ' + wins.length + '개 추출됨.'
    : '윈도우가 ' + wins.length + '개뿐입니다. 조작 시간을 60초 이상으로 늘려 다시 수집하세요.';

  $('summary').textContent = JSON.stringify({
    session_id: sess.session_id, condition: sess.condition,
    duration_s: +(sess.duration_ms / 1000).toFixed(1),
    input_events: S.inputCount, motion_samples: S.motionCount,
    motion_hz: +sess.diagnostics.motion_hz.toFixed(1),
    clock_skew_ms: +sess.diagnostics.clock_skew_mean_ms.toFixed(2),
    windows: wins.length,
    mean_coupling_z: +meanZ.toFixed(3)
  }, null, 2);
}

function buildSession() {
  var evs = S.events;
  var mot = evs.filter(function (e) { return e.type === 'motion'; });
  var hz = mot.length > 1 ? (mot.length - 1) / ((mot[mot.length - 1].t - mot[0].t) / 1000) : 0;
  var skew = S.skews.length ? S.skews.reduce(function (a, b) { return a + b; }, 0) / S.skews.length : 0;
  var skewSd = 0;
  if (S.skews.length > 1) {
    skewSd = Math.sqrt(S.skews.reduce(function (a, b) { return a + (b - skew) * (b - skew); }, 0) / (S.skews.length - 1));
  }
  var t0 = evs.length ? evs[0].t : 0;
  return {
    schema: 'remoteguard.session.v1',
    session_id: $('subject').value + '_' + S.cond + '_' + $('trial').value + '_' + Date.now(),
    subject_id: $('subject').value,
    trial: +$('trial').value,
    condition: S.cond,
    label: /^remote/.test(S.cond) ? 1 : 0,
    collected_at: new Date().toISOString(),
    duration_ms: evs.length ? evs[evs.length - 1].t - t0 : 0,
    device: {
      ua: navigator.userAgent, dpr: window.devicePixelRatio,
      screen: { w: screen.width, h: screen.height },
      touch_points: navigator.maxTouchPoints, lang: navigator.language
    },
    diagnostics: {
      motion_hz: hz,
      clock_skew_mean_ms: skew,       // performance.now() minus event.timeStamp
      clock_skew_sd_ms: skewSd,       // near 0 => the two clocks are the same base
      motion_samples: mot.length,
      input_events: evs.length - mot.length
    },
    // times rebased to session start so sessions are comparable
    events: evs.map(function (e) { var c = Object.assign({}, e); c.t = +(e.t - t0).toFixed(3); return c; })
  };
}

$('btnDownload').addEventListener('click', function () {
  var s = window.__lastSession;
  var blob = new Blob([JSON.stringify(s)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = s.session_id + '.json';
  document.body.appendChild(a); a.click(); a.remove();
});

function uploadWithRetry(base, sess, attempt) {
  attempt = attempt || 1;
  var MAX = 6; // Render free tier can take ~50s to wake from sleep
  $('upMsg').className = 'warnbox';
  $('upMsg').textContent = attempt === 1 ? '업로드 중…'
    : '서버 깨우는 중… (' + attempt + '/' + MAX + ') 최초 접속은 최대 1분 걸립니다';
  return fetch(base + '/api/v1/sessions', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(sess)
  }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      $('upMsg').className = res.ok ? 'okbox' : 'errbox';
      $('upMsg').textContent = res.ok
        ? '저장됨 · 윈도우 ' + (res.j.windows != null ? res.j.windows : '?') + '개'
        : '서버 응답 오류: ' + JSON.stringify(res.j);
    })
    .catch(function (e) {
      if (attempt < MAX) {
        return new Promise(function (r) { setTimeout(r, 10000); })
          .then(function () { return uploadWithRetry(base, sess, attempt + 1); });
      }
      // give up on network, but never lose the session: stash it locally
      try {
        var key = 'rg_pending_' + sess.session_id;
        localStorage.setItem(key, JSON.stringify(sess));
        $('upMsg').className = 'warnbox';
        $('upMsg').textContent = '서버 연결 실패 — 세션을 기기에 임시 저장했습니다. '
          + '아래 "JSON 내려받기"로도 백업하세요. (' + e.message + ')';
      } catch (_) {
        $('upMsg').className = 'errbox';
        $('upMsg').textContent = '업로드 실패: ' + e.message + ' — "JSON 내려받기"로 저장하세요.';
      }
    });
}

$('btnUpload').addEventListener('click', function () {
  var base = $('api').value.replace(/\/$/, '');
  if (!base) { $('upMsg').className = 'errbox'; $('upMsg').textContent = '서버 주소를 입력하세요.'; return; }
  localStorage.setItem('rg_api', base);
  uploadWithRetry(base, window.__lastSession, 1);
});

$('btnAgain').addEventListener('click', function () {
  $('done').classList.add('hide'); $('setup').classList.remove('hide');
  $('trial').value = +$('trial').value + 1;
  $('upMsg').textContent = ''; $('upMsg').className = '';
});

var saved = localStorage.getItem('rg_api'); if (saved) $('api').value = saved;
</script>
</body>
</html>
